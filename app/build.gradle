plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amr.farmledger'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amr.farmledger'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '4.0'
    }

    // One fixed key for every build, so a new APK installs over the old one.
    signingConfigs {
        farm {
            storeFile rootProject.file('keystore/farmledger.jks')
            storePassword 'DKW5bHeY-QIC76H0QfxU7RvZ'
            keyAlias 'farmledger'
            keyPassword 'DKW5bHeY-QIC76H0QfxU7RvZ'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.farm
        }
        debug {
            signingConfig signingConfigs.farm
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
