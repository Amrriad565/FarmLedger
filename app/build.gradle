plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amr.farmledger'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amr.farmledger'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly on your phone.
            // For Google Play, replace this with your own release keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
