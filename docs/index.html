<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابات الأرض</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f4a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسابات الأرض">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one narrow column like a farmer's ledger book — balance band on top, entry sheet, then the ledger by month */
:root{
  --bg:#f3f1e8; --surface:#fffdf6; --line:#ddd8c6; --fg:#23271c; --muted:#6d6f5f;
  --accent:#3f6b2a; --accent-ink:#ffffff; --in:#2f7d3a; --in-soft:#e2efd9; --out:#b2442c; --out-soft:#f7e1d9;
  --band:#2f4a22; --band-fg:#f1f4e6; --band-muted:#c3cfaa;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a13; --surface:#20241a; --line:#363b2c; --fg:#e8eadc; --muted:#a0a48e;
  --accent:#8dbb5f; --accent-ink:#13170e; --in:#86c873; --in-soft:#25351d; --out:#ec8a6f; --out-soft:#3b231b;
  --band:#24371a; --band-fg:#eef2df; --band-muted:#a9b98c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a13; --surface:#20241a; --line:#363b2c; --fg:#e8eadc; --muted:#a0a48e;
  --accent:#8dbb5f; --accent-ink:#13170e; --in:#86c873; --in-soft:#25351d; --out:#ec8a6f; --out-soft:#3b231b;
  --band:#24371a; --band-fg:#eef2df; --band-muted:#a9b98c; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

header.band{background:var(--band);color:var(--band-fg)}
header.band .wrap{padding-block:calc(14px + env(safe-area-inset-top,0px)) 22px;display:grid;gap:14px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;text-wrap:balance}
.season{font-size:.85rem;color:var(--band-muted)}
.bal-label{font-size:.85rem;color:var(--band-muted);letter-spacing:.02em}
.bal{font-family:var(--display);font-size:2.4rem;line-height:1.1;font-weight:700}
.bal small{font-family:var(--body);font-size:.95rem;font-weight:500;color:var(--band-muted);margin-inline-start:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{border-top:1px solid color-mix(in srgb,var(--band-fg) 22%,transparent);padding-top:8px}
.split span{display:block;font-size:.8rem;color:var(--band-muted)}
.split b{font-size:1.15rem}

main .wrap{padding-block:18px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}
section h2{font-family:var(--display);font-size:1.1rem;font-weight:500;margin:0 0 10px}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{font:inherit;font-weight:700;padding:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.toggle button[aria-pressed="true"].in{background:var(--in-soft);color:var(--in)}
.toggle button[aria-pressed="true"].out{background:var(--out-soft);color:var(--out)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#amount{font-size:1.4rem;font-weight:700;direction:ltr;text-align:right}
.primary{font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:10px;padding:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.primary:active{transform:translateY(1px)}
.msg{font-size:.85rem;color:var(--out);min-height:1.2em;margin:0}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.month{margin-bottom:16px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px 6px;border-bottom:2px solid var(--line);font-weight:700}
.mhead .net{font-size:.9rem}
ul.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.day{width:42px;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.2}
.day b{display:block;font-size:1.15rem;color:var(--fg)}
.what{min-width:0}
.what .cat{font-weight:700;display:block}
.what .who{display:block}
.what .note{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.amt{font-weight:800;text-align:left}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.del{font:inherit;font-size:.78rem;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 0;display:block;margin-inline-start:auto}
.del.confirm{color:var(--out);font-weight:700}

.cats{display:grid;gap:8px}
.cat-row{display:grid;grid-template-columns:7.5rem 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.cat-row .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.cat-row .bar i{display:block;height:100%;background:var(--out);border-radius:5px}
.cat-row.in-row .bar i{background:var(--in)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.note-bar{font-size:.85rem;color:var(--muted);text-align:center}
@media (max-width:380px){.cat-row{grid-template-columns:6rem 1fr auto}.bal{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{font:inherit;font-size:.9rem;font-weight:700;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tools .wide{grid-column:1/-1}
.tools-msg{font-size:.85rem;color:var(--muted);margin:8px 0 0;min-height:1.2em;overflow-wrap:anywhere}
.confirm-box{background:var(--out-soft);color:var(--fg);border-radius:10px;padding:12px;margin-top:8px;display:grid;gap:8px}
.confirm-box .acts{display:flex;gap:8px}
.confirm-box button{font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.confirm-box button.go{background:var(--out);color:#fff;border-color:var(--out)}

.who{font-size:.75rem;color:var(--muted)}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--band-muted)}
.userbar button{font:inherit;font-size:.8rem;background:none;border:1px solid color-mix(in srgb,var(--band-fg) 30%,transparent);color:var(--band-fg);border-radius:999px;padding:3px 12px;cursor:pointer}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--band-muted)}
.sync.ok i{background:#8dbb5f}.sync.off i{background:#e0a34a}
.login{max-width:420px;margin:0 auto;padding-block:48px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.login h1{color:var(--accent);font-size:1.8rem}
.login p{margin:0;color:var(--muted)}
#login-email{direction:ltr;text-align:left}
#login-pass{direction:ltr;text-align:left}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>دفتر حسابات الأرض</h1>
  <p>ادخل بالإيميل والباسورد اللي اتعملولك. الحسابات مشتركة بينك وبين شريكك.</p>
  <form class="sheet" id="login-form" novalidate>
    <label>الإيميل<input type="email" id="login-email" autocomplete="username" inputmode="email"></label>
    <label>الباسورد<input type="password" id="login-pass" autocomplete="current-password"></label>
    <button class="primary" type="submit" id="login-btn">دخول</button>
    <p class="msg" id="login-msg" aria-live="polite"></p>
  </form>
</div>
<div id="boot" class="login"><p>جارٍ التحميل…</p></div>
<div id="app" hidden>
<header class="band">
  <div class="wrap">
    <div class="userbar"><span class="sync" id="sync"><i></i><span id="sync-t">جارٍ الاتصال…</span></span><button type="button" id="logout">خروج</button></div>
    <div class="brand"><h1>دفتر حسابات الأرض</h1><span class="season" id="today"></span></div>
    <div>
      <div class="bal-label">الرصيد (الوارد − المنصرف)</div>
      <div class="bal"><span class="num" id="bal">0</span><small>جنيه</small></div>
    </div>
    <div class="split">
      <div><span>إجمالي الوارد</span><b class="num" id="tin">0</b></div>
      <div><span>إجمالي المنصرف</span><b class="num" id="tout">0</b></div>
    </div>
  </div>
</header>

<main>
<div class="wrap">
  <section aria-labelledby="add-h">
    <h2 id="add-h">تسجيل حركة</h2>
    <form class="sheet" id="form" novalidate>
      <div class="toggle" role="group" aria-label="نوع الحركة">
        <button type="button" class="out" id="t-out" aria-pressed="true">منصرف</button>
        <button type="button" class="in" id="t-in" aria-pressed="false">وارد</button>
      </div>
      <label>المبلغ بالجنيه
        <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>
      <div class="row">
        <label>البند<select id="cat"></select></label>
        <label>التاريخ<input type="date" id="date"></label>
      </div>
      <label>البيان (اختياري)<input id="note" autocomplete="off" placeholder="مثال: ٤ شكاير يوريا"></label>
      <button class="primary" type="submit" id="save">حفظ الحركة</button>
      <p class="msg" id="msg" aria-live="polite"></p>
    </form>
  </section>

  <section aria-labelledby="led-h">
    <h2 id="led-h">الدفتر</h2>
    <div class="tabs" role="group" aria-label="عرض">
      <button type="button" data-f="all" aria-pressed="true">الكل</button>
      <button type="button" data-f="in" aria-pressed="false">الوارد</button>
      <button type="button" data-f="out" aria-pressed="false">المنصرف</button>
    </div>
    <div id="ledger"><div class="empty">جارٍ تحميل الحسابات…</div></div>
  </section>

  <section aria-labelledby="cat-h" id="cat-sec" hidden>
    <h2 id="cat-h">المصاريف حسب البند</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section aria-labelledby="tools-h">
    <h2 id="tools-h">تصدير واستيراد</h2>
    <div class="tools">
      <button type="button" id="b-csv" class="wide">تصدير ملف Excel</button>
      <button type="button" id="b-restore" class="wide">استيراد نسخة احتياطية من التطبيق القديم</button>
    </div>
    <input type="file" id="restore-file" accept=".json,application/json,text/plain,*/*" hidden>
    <div id="restore-confirm" class="confirm-box" hidden>
      <span id="restore-text"></span>
      <div class="acts"><button type="button" class="go" id="r-yes">إضافة</button><button type="button" id="r-no">إلغاء</button></div>
    </div>
    <p class="tools-msg" id="tools-msg" aria-live="polite"></p>
  </section>

  <p class="note-bar" id="status"></p>
</div>
</main>

</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const CATS={
  in:["بيع محصول","بيع تبن / مخلفات","إيجار أرض (محصل)","دعم / تعويض","وارد آخر"],
  out:["تقاوي / شتلات","أسمدة","مبيدات","ري / سولار / كهرباء","عمالة / يوميات","حرث وخدمة آلات","حصاد ودراس","نقل","إيجار أرض (مدفوع)","صيانة","منصرف آخر"]
};
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("en-US");
const Bridge=window.AndroidBridge||null;
let type="out", filter="all", entries=[], pendingDel=null, pendingRestore=null, col=null, me=null, unsub=null;

if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}

function show(which){$("boot").hidden=which!=="boot";$("login").hidden=which!=="login";$("app").hidden=which!=="app"}
function valid(e){return e&&typeof e.amount==="number"&&e.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&(e.type==="in"||e.type==="out")}
const shortName=email=>(email||"").split("@")[0];

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
$("date").value=todayISO();
{const d=new Date();$("today").textContent=d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()}

function fillCats(){$("cat").innerHTML=CATS[type].map(c=>`<option>${c}</option>`).join("")}
function setType(t){type=t;$("t-in").setAttribute("aria-pressed",t==="in");$("t-out").setAttribute("aria-pressed",t==="out");fillCats()}
$("t-in").onclick=()=>setType("in");$("t-out").onclick=()=>setType("out");fillCats();
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
const normDigits=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,،]/g,".");

function setSync(state,text){const s=$("sync");s.className="sync "+state;$("sync-t").textContent=text}
function friendlyErr(e){
  const c=(e&&e.code)||"";
  if(c.includes("permission-denied"))return "الحساب ده مالوش صلاحية على الدفتر. اتأكد إن الإيميل متضاف في قواعد الأمان.";
  if(c.includes("wrong-password")||c.includes("invalid-credential")||c.includes("user-not-found")||c.includes("invalid-login"))return "الإيميل أو الباسورد غلط.";
  if(c.includes("invalid-email"))return "الإيميل مكتوب غلط.";
  if(c.includes("too-many-requests"))return "محاولات كتير. استنى شوية وجرّب تاني.";
  if(c.includes("network"))return "مفيش نت. اتأكد من الاتصال وجرّب تاني.";
  return "حصلت مشكلة: "+(e&&e.message||c);
}

/* ---------- Firebase ---------- */
if(!window.FIREBASE_CONFIG||!window.firebase){
  $("boot").innerHTML='<p>التطبيق لسه مش متوصّل بقاعدة البيانات، أو مفيش نت في أول تشغيل.</p>';
}else{
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth=firebase.auth(), fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  col=fs.collection("entries");

  $("login-form").addEventListener("submit",async e=>{
    e.preventDefault();$("login-msg").textContent="";
    const em=$("login-email").value.trim(), pw=$("login-pass").value;
    if(!em||!pw){$("login-msg").textContent="اكتب الإيميل والباسورد.";return}
    $("login-btn").disabled=true;
    try{await auth.signInWithEmailAndPassword(em,pw)}catch(err){$("login-msg").textContent=friendlyErr(err)}
    finally{$("login-btn").disabled=false}
  });
  $("logout").onclick=()=>{auth.signOut()};

  auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    me=u;
    if(!u){entries=[];show("login");return}
    show("app");setSync("","جارٍ التحميل…");
    $("ledger").innerHTML='<div class="empty">جارٍ تحميل الحسابات…</div>';
    unsub=col.onSnapshot({includeMetadataChanges:true},snap=>{
      entries=snap.docs.map(d=>({id:d.id,...d.data()})).filter(valid);
      const pending=snap.metadata.hasPendingWrites, cached=snap.metadata.fromCache;
      if(pending)setSync("off","في تعديلات لسه ماتبعتتش");
      else if(cached)setSync("off","أوفلاين — هيتزامن لما النت يرجع");
      else setSync("ok","متزامن");
      render();
    },err=>{setSync("off","مش متصل");$("ledger").innerHTML='<div class="empty"></div>';$("ledger").firstChild.textContent=friendlyErr(err)});
  });
}

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  if(!col||!me)return;
  const amt=parseFloat(normDigits($("amount").value.trim()));
  if(!(amt>0)){$("msg").textContent="اكتب المبلغ بالأرقام، أكبر من صفر.";$("amount").focus();return}
  if(!$("date").value){$("msg").textContent="اختار التاريخ.";return}
  // fire-and-forget: Firestore saves locally at once and syncs when online
  col.add({type,amount:amt,cat:$("cat").value,date:$("date").value,note:$("note").value.trim(),created:Date.now(),by:me.email||""})
    .catch(err=>{$("msg").textContent=friendlyErr(err)});
  $("amount").value="";$("note").value="";$("msg").textContent="";
});

function render(){
  let tin=0,tout=0;const byCat={};
  for(const e of entries){if(e.type==="in")tin+=e.amount;else{tout+=e.amount;byCat[e.cat]=(byCat[e.cat]||0)+e.amount}}
  $("tin").textContent=fmt(tin);$("tout").textContent=fmt(tout);
  const bal=tin-tout;$("bal").textContent=(bal<0?"−":"")+fmt(Math.abs(bal));

  const list=entries.filter(e=>filter==="all"||e.type===filter)
    .sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  if(!entries.length){$("ledger").innerHTML='<div class="empty">لسه مفيش حركات. سجّل أول مصروف أو وارد من الفورم اللي فوق، وهيظهر هنا عندك وعند شريكك.</div>'}
  else if(!list.length){$("ledger").innerHTML='<div class="empty">مفيش حركات من النوع ده.</div>'}
  else{
    const groups={};
    for(const e of list){const k=e.date.slice(0,7);(groups[k]=groups[k]||[]).push(e)}
    $("ledger").innerHTML=Object.keys(groups).map(k=>{
      const [y,m]=k.split("-");const g=groups[k];
      const net=g.reduce((s,e)=>s+(e.type==="in"?e.amount:-e.amount),0);
      return `<div class="month"><div class="mhead"><span>${MONTHS[+m-1]} ${y}</span>
        <span class="net ${net>=0?"amt in":"amt out"}">صافي <span class="num">${net<0?"−":""}${fmt(Math.abs(net))}</span></span></div>
        <ul class="entries">${g.map(e=>`<li class="entry">
          <div class="day"><b class="num">${+e.date.slice(8)}</b>${MONTHS[+m-1].slice(0,3)}</div>
          <div class="what"><span class="cat"></span><span class="note"></span><span class="who"></span></div>
          <div><div class="amt ${e.type}"><span class="num">${e.type==="in"?"+":"−"}${fmt(e.amount)}</span></div>
          <button type="button" class="del${pendingDel===e.id?" confirm":""}" data-id="${e.id}">${pendingDel===e.id?"تأكيد الحذف؟":"حذف"}</button></div>
        </li>`).join("")}</ul></div>`}).join("");
    const items=$("ledger").querySelectorAll(".entry");let i=0;
    for(const k of Object.keys(groups))for(const e of groups[k]){const li=items[i++];
      li.querySelector(".cat").textContent=e.cat||"";li.querySelector(".note").textContent=e.note||"";
      li.querySelector(".who").textContent=e.by?("سجّلها: "+shortName(e.by)):"";
      if(e.note)li.querySelector(".note").style.display="block";}
    $("ledger").querySelectorAll(".del").forEach(b=>b.onclick=()=>{
      const id=b.dataset.id;
      if(pendingDel!==id){pendingDel=id;render();return}
      pendingDel=null;col.doc(id).delete().catch(err=>{$("status").textContent=friendlyErr(err)});
    });
  }
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  $("cat-sec").hidden=!cats.length;
  const max=cats.length?cats[0][1]:1;
  $("cats").innerHTML=cats.map(([c,v])=>`<div class="cat-row"><span class="cn"></span>
    <div class="bar"><i style="width:${Math.max(3,v/max*100)}%"></i></div>
    <span class="num">${fmt(v)} · ${Math.round(v/tout*100)}%</span></div>`).join("");
  $("cats").querySelectorAll(".cn").forEach((s,i)=>s.textContent=cats[i][0]);
}

/* ---------- Excel export / import ---------- */
const tmsg=t=>{$("tools-msg").textContent=t};
function saveOut(name,mime,text){
  if(Bridge&&Bridge.saveFile){
    const r=Bridge.saveFile(name,mime,text);
    tmsg(String(r).startsWith("ERR:")?"ماقدرناش نحفظ الملف.":"اتحفظ في: "+r);return;
  }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();tmsg("تم تنزيل "+name)}
  catch(_){tmsg("التنزيل مش متاح هنا.")}
}
$("b-csv").onclick=()=>{
  if(!entries.length){tmsg("مفيش حركات تتصدّر لسه.");return}
  const esc=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[["التاريخ","النوع","البند","البيان","وارد","منصرف","الرصيد","سجّلها"]];
  let bal=0;
  [...entries].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created).forEach(e=>{
    bal+=e.type==="in"?e.amount:-e.amount;
    rows.push([e.date,e.type==="in"?"وارد":"منصرف",e.cat,e.note,e.type==="in"?e.amount:"",e.type==="out"?e.amount:"",bal,shortName(e.by)]);
  });
  saveOut("حسابات-الأرض-"+todayISO()+".csv","text/csv","﻿"+rows.map(r=>r.map(esc).join(",")).join("\r\n"));
};
$("b-restore").onclick=()=>{$("restore-file").value="";$("restore-file").click()};
$("restore-file").onchange=()=>{
  const f=$("restore-file").files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      const list=(Array.isArray(data)?data:data.entries||[]).filter(valid);
      if(!list.length){tmsg("الملف ده مفيهوش حركات صالحة.");return}
      pendingRestore=list;
      $("restore-text").textContent="الملف فيه "+list.length+" حركة، وهتتضاف للدفتر المشترك.";
      $("restore-confirm").hidden=false;tmsg("");
    }catch(_){tmsg("الملف ده مش نسخة احتياطية من التطبيق.")}
  };
  rd.readAsText(f);
};
$("r-yes").onclick=async()=>{
  const list=pendingRestore||[];pendingRestore=null;$("restore-confirm").hidden=true;
  if(!col||!me)return;
  try{
    const fs=firebase.firestore();
    for(let i=0;i<list.length;i+=400){
      const batch=fs.batch();
      list.slice(i,i+400).forEach(e=>batch.set(col.doc(),{type:e.type,amount:e.amount,cat:String(e.cat||""),date:e.date,note:String(e.note||""),created:+e.created||Date.now(),by:me.email||""}));
      await batch.commit();
    }
    tmsg("اتضافت "+list.length+" حركة.");
  }catch(err){tmsg(friendlyErr(err))}
};
$("r-no").onclick=()=>{pendingRestore=null;$("restore-confirm").hidden=true};
</script>
